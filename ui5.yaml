# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: fdrevampxbrowser
type: application
server:
  customMiddleware:
    - name: ui5-middleware-route-proxy
      afterMiddleware: compression
      configuration:
        debug: false
        /sap/opu/odata/sap/:
          target: https://swd.eptarefrigeration.com:3000
          auth:
            user: MHD_RM_3980
            pass: EptaProject24!
            client: "400"
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        debug: true
        ignoreCertError: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap/opu/odata/sap/
            url: https://swd.eptarefrigeration.com:3000
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: fdrevampxbrowser
        ui5Theme: sap_horizon
