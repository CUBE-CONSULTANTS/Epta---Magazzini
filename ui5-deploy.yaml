# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: fdrevampxbrowser
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      debug: true
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://swd.eptarefrigeration.com:2000
          client: "400"
        app:
          name: Z_GESTMAGAZZINI
          description: Gestione Magazzini
          package: ZXBROWSER
          transport: DVSK909604
